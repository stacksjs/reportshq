dependencies:
  # Pinned exactly, at the version CI and the production box run. A range
  # resolves through pantry's `v1` symlink and moves every checkout the day a
  # new minor publishes. 1.3.x is no longer an option: it cannot resolve the
  # tarball URL dependencies the current framework carries, so `bun install`
  # fails there. Moving the pin is a deliberate commit.
  bun: 1.4.4
  git: ^2.47.0
  sqlite: ^3.47.2
