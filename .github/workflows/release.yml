name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          # The changelog is generated from commits since the previous tag, so
          # the full history has to be present.
          fetch-depth: 0

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@c1417d98f5613290bc3b1f96d35086b834684659 # v0.10.47 + the socket-hang-up retry fix
        with:
          install: 'false'

      - name: Use Cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: bun install

      - name: Build the Stacks package
        working-directory: packages/stacks
        run: bun run build

      - name: Verify the built package
        # A published build that does not export what it claims is worse than a
        # failed release: it installs, and fails at the first import in
        # somebody else's application. This imports the artefact rather than
        # the source, so a stale or partial build stops here.
        run: >-
          bun -e "import { Registry, Compiler, Runner, elementHtml, reportRoutes } from './packages/stacks/dist/index.js';
          const r = new Registry({ o: { table: 'o', measures: { c: { aggregate: 'count' } }, time: {}, dimensions: {} } });
          if (!r.has('o') || typeof elementHtml !== 'function' || typeof reportRoutes !== 'function')
          throw new Error('published package build is stale')"

      - name: Publish the Stacks package
        working-directory: packages/stacks
        # `pantry publish` rather than `npm publish`, matching the other
        # packages in the org: it reads the same manifest and applies the same
        # access and provenance flags everywhere.
        run: pantry publish --npm --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: stacksjs/action-releaser@v1.2.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
