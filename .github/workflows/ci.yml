name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@c1417d98f5613290bc3b1f96d35086b834684659 # v0.10.47 + the socket-hang-up retry fix
        with:
          install: 'false'

      - name: Use cached node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: bun install

      - name: Lint
        run: bun buddy lint

  typecheck:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@c1417d98f5613290bc3b1f96d35086b834684659 # v0.10.47 + the socket-hang-up retry fix
        with:
          install: 'false'

      - name: Use cached node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install dependencies
        run: bun install

      - name: Set Application Key
        run: bun buddy key:generate

      # `packages/stacks/dist` and the chart bundles are build outputs, and both
      # are gitignored, so a fresh checkout has neither. Skipping this does not
      # look like a missing build: `@reportshq/stacks` fails to resolve, which
      # reads as a missing dependency. It cost four "Cannot find module" errors
      # in typecheck, a route registry that could not load `routes/reports.ts`
      # at all — taking every test that touches a route down with it — and a
      # dead `/reportshq-charts.css` on the landing page.
      - name: Build artifacts
        run: bun run build:artifacts

      - name: Typecheck
        run: bun buddy test:types

  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@c1417d98f5613290bc3b1f96d35086b834684659 # v0.10.47 + the socket-hang-up retry fix
        with:
          install: 'false'

      - name: Use cached node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: bun install

      - name: Set Application Key
        run: bun buddy key:generate

      # The gitignored build outputs. See the typecheck job.
      - name: Build artifacts
        run: bun run build:artifacts

      # Feature tests query real tables, and a fresh checkout has no database
      # file at all (it is gitignored, being machine-local state). Without this
      # the suite fails in beforeAll with "no such table", which reads like a
      # broken test rather than a missing schema.
      # --force because this database is created from nothing in this job, a
      # few seconds earlier, so there is nothing a destructive change could
      # destroy. `migrate` otherwise refuses them non-interactively, which is
      # exactly the behaviour production should keep: a rebuild there blocks
      # the deploy and asks a human, and the deploy step deliberately does NOT
      # pass this flag.
      - name: Migrate the database
        run: bun buddy migrate --force

      - name: Test Suite
        run: bun run test

      # The integration packages are a separate workspace and `buddy test` only
      # walks the app's own tests/, so without this their suites never run in
      # CI and a broken transport ships silently. They typecheck separately too:
      # the app's include list is framework-owned and does not reach into
      # packages/, which hid two real type errors when this package was written.
      - name: Integration packages
        run: |
          bun test ./packages
          bunx --bun tsc --noEmit -p packages/stacks/tsconfig.json

      # The Laravel package is plain PHP with no Illuminate dependency in the
      # parts worth testing, so this needs the php the runner already ships and
      # nothing else: no composer install, no vendor directory, no network. It
      # runs the same docs/fixtures/sdk-events.json contract the Stacks package
      # asserts, which is what stops the two SDKs drifting.
      #
      # Every suite, not just run.php. compiler, layout, license and semantic
      # were written and then never run here — 84 assertions that could go red
      # without anything saying so, which is indistinguishable from not having
      # them. tests/server.php is deliberately absent: it is a fake ingest that
      # run.php spawns under `php -S`, not a suite.
      - name: Laravel package
        run: |
          for suite in run compiler layout license semantic filament; do
            echo "--- $suite"
            php "packages/laravel/tests/$suite.php"
          done

      # The design system has no types and no tests of its own: a renamed custom
      # property resolves to the property's initial value rather than erroring,
      # and a documented contrast ratio can drift from the colour it describes
      # without anything failing. This asserts both.
      - name: Design tokens
        run: bun scripts/verify-tokens.ts

  # Push to deploy.
  #
  # This job lives in CI rather than in a workflow of its own so the gates are
  # `needs`, not a copy of the same steps. The first attempt was a separate
  # deploy.yml that re-ran lint, typecheck and test itself; it failed on the
  # first push because it had not copied the `key:generate` and `migrate` steps
  # the test job needs, which is exactly the drift duplication produces.
  #
  # A red build therefore means NO deploy, silently and by construction.
  deploy:
    needs: [lint, typecheck, test, test-postgres]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # Queue deploys rather than cancelling them. Two runs racing to write the
    # same systemd unit and rpx fragment on a box shared with a dozen tenants is
    # worse than one slow deploy: the loser can leave the gateway parsing a
    # half-written fragment and drop a host until the next reload.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    environment:
      name: production
      url: https://reportshq.org

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@c1417d98f5613290bc3b1f96d35086b834684659 # v0.10.47 + the socket-hang-up retry fix
        with:
          install: 'false'

      - name: Install Dependencies
        run: bun install

      # Before `buddy deploy`, which tars the WORKING DIRECTORY: an artifact
      # that has not been built by this point is simply absent from the
      # release. That is not a broken asset but a broken site — `routes/reports.ts`
      # cannot import a package that was never built, and a route file that
      # throws takes the whole registry with it.
      - name: Build artifacts
        run: bun run build:artifacts

      # ts-cloud reads the PUBLIC key off disk to register it, so it is derived
      # from the private one rather than stored as a second secret. Two secrets
      # that have to agree eventually stop agreeing.
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # The release is built from this clean checkout rather than from a laptop,
      # and that is the point rather than a convenience: `buddy deploy` tars the
      # WORKING DIRECTORY, not the commit, so a local deploy ships whatever
      # happens to be checked out.
      - name: Deploy
        env:
          # Decrypts .env.production, which is committed encrypted and carries
          # every application secret. The private key exists only here.
          DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
          # Needed even though this attaches to an existing box: ts-cloud still
          # resolves the server through the Hetzner API.
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          # DNS reconcile for reportshq.org, whose zone lives on Porkbun.
          PORKBUN_API_KEY: ${{ secrets.PORKBUN_API_KEY }}
          PORKBUN_SECRET_KEY: ${{ secrets.PORKBUN_SECRET_KEY }}
          APP_ENV: production
          APP_URL: https://reportshq.org
          APP_DOMAIN: reportshq.org
        run: ./buddy deploy --prod --yes

      # A deploy exiting 0 does not mean the site works: a release can ship, the
      # unit can start, and every request can still 500. These are the pages a
      # stranger actually lands on.
      - name: Verify the site is serving
        run: |
          set -uo pipefail
          fail=0

          # One helper, so every check retries the same way. One of these was
          # once written out longhand without the retry flags, and a single
          # connection blip after seven successful requests failed a deploy
          # that had already succeeded. A verification step that cries wolf is
          # worse than none: the next red run gets waved through.
          #
          # `-w` prints 000 itself when the connection never happened, so there
          # is no `|| echo` fallback here. Having both printed 000000, which
          # matches no expected code and reads like a different failure.
          probe() {
            curl -sS -o /dev/null -w '%{http_code}' \
              --retry 5 --retry-delay 5 --retry-all-errors --max-time 30 "$@"
          }

          # /login, /register and /reports are here because the pages a stranger
          # lands on were the only ones checked, and the break that mattered was
          # one page further in: all three bounced to a `/projects` that had been
          # deleted, and every probe above stayed green throughout.
          #
          # 200 is a weak assertion for /reports — it renders for an anonymous
          # caller and lets AuthGuard bounce the browser, so curl sees the shell
          # either way. It still catches the failures that matter here: a route
          # that stopped being registered, and a page that 500s.
          for path in / /pricing /features /compare/metabase /docs /sitemap.xml /robots.txt /login /register /reports; do
            code=$(probe "https://reportshq.org${path}")
            printf '%-24s %s\n' "$path" "$code"
            [ "$code" = "200" ] || fail=1
          done

          # There was a POST /ingest probe here, asserting the 401 that a
          # write-only key endpoint owes an anonymous caller. The hosted
          # pipeline it belonged to was retired in b3dbf0b and `routes/` no
          # longer has an ingest file, so the check now asserts a 401 from a
          # route that answers 404. Reports read this application's own
          # database; there is no write surface left to probe.

          exit $fail

  # The same suite against Postgres, and a hard gate on the deploy.
  #
  # Production is Postgres and the suite defaults to SQLite, so every difference
  # between them is a bug that passes CI and fails on the live site. That is not
  # hypothetical. The first run of this job found 83 failures in code whose
  # SQLite suite was entirely green:
  #
  #   - `?` placeholders, which Postgres rejects with an error naming the NEXT
  #     token, so `a = ? AND b = ?` complains about "AND"
  #   - SQLite-only `strftime` and `json_extract` through the query engine
  #   - booleans written as 1 and 0, in nine statements and two fixtures
  #   - a literal 'owner' unified with an enum column, which Postgres coerces
  #     into the enum and refuses
  #   - JSON blobs in varchar(255), because `schema.text()` produced the same
  #     column as `schema.string()`
  #   - `LIMIT -1 OFFSET n`, the SQLite idiom for "everything after n"
  #   - `schema.number()` mapped to an integer column, silently rounding 99.5
  #     to 100 with no error anywhere
  #
  # Every one of those shipped to a live site that served every page correctly.
  # Keep this gating.
  test-postgres:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: reportshq
          POSTGRES_PASSWORD: reportshq
          POSTGRES_DB: reportshq_test
        ports:
          - 5432:5432
        # Without this the job races the container and the first query fails
        # with a connection error that looks like a broken test.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_CONNECTION: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: reportshq_test
      DB_USERNAME: reportshq
      DB_PASSWORD: reportshq

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@c1417d98f5613290bc3b1f96d35086b834684659 # v0.10.47 + the socket-hang-up retry fix
        with:
          install: 'false'

      - name: Install Dependencies
        run: bun install

      - name: Set Application Key
        run: bun buddy key:generate

      # The gitignored build outputs. See the typecheck job.
      - name: Build artifacts
        run: bun run build:artifacts

      # --force because this database is created from nothing in this job, a
      # few seconds earlier, so there is nothing a destructive change could
      # destroy. `migrate` otherwise refuses them non-interactively, which is
      # exactly the behaviour production should keep: a rebuild there blocks
      # the deploy and asks a human, and the deploy step deliberately does NOT
      # pass this flag.
      - name: Migrate the database
        run: bun buddy migrate --force

      - name: Test Suite
        run: bun test tests/
