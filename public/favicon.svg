<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="ReportsHQ">
  <!-- The same three ascending bars as resources/components/Wordmark.stx, on a
       filled tile so the mark still reads at 16px in a browser tab.
       The tile is the light-mode accent; a tab strip has no theme of its own to
       follow, so this one is fixed rather than themed. -->
  <rect width="32" height="32" rx="7" fill="#3a4fd0" />
  <rect x="6" y="18" width="5" height="9" rx="1.5" fill="#ffffff" opacity="0.5" />
  <rect x="13.5" y="12" width="5" height="15" rx="1.5" fill="#ffffff" opacity="0.75" />
  <rect x="21" y="5" width="5" height="22" rx="1.5" fill="#ffffff" />
</svg>
